[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "docingest"
version = "1.0.0"
description = "Serverless ingestion of aviation technical documents (2M docs/day) into a vector index on AWS"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Suyog Dabhole" }]
dependencies = [
  "boto3>=1.43",
  "aws-lambda-powertools[tracer]>=3.30,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "beautifulsoup4>=4.12",
  "opensearch-py>=2.7",
  "requests-aws4auth>=1.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "moto[s3,sqs,dynamodb,stepfunctions]>=5.1",
  "reportlab>=4.2",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/docingest"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"samples/**" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
